[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aim-model-1"
version = "0.1.0"
description = "AIM reproducible research-loop engineering foundation"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
train = ["torch==2.8.0", "numpy==2.2.6"]

[project.scripts]
aim = "aim.cli:main"

[tool.setuptools.packages.find]
include = ["aim*"]
